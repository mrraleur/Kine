<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exercices de kiné</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1b2733;--muted:#5d6b78;--accent:#0f7b6c;--accent-text:#fff;--border:#d5dce2;--sel:#d9f2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--card:#1c252c;--text:#eef2f5;--muted:#9aa8b4;--accent:#3cc4b0;--accent-text:#06231e;--border:#33414b;--sel:#1d4a43}}
:root[data-theme="dark"]{--bg:#12181d;--card:#1c252c;--text:#eef2f5;--muted:#9aa8b4;--accent:#3cc4b0;--accent-text:#06231e;--border:#33414b;--sel:#1d4a43}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.4;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
h2{font-size:1rem;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:16px 8px;font-size:1.05rem;font-weight:600;cursor:pointer;font-family:inherit}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.opt.wide{grid-column:span 2}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step{width:56px;height:56px;border-radius:50%;border:2px solid var(--border);background:var(--card);color:var(--text);font-size:1.8rem;cursor:pointer}
.num{font-size:2.4rem;font-weight:700;min-width:80px;text-align:center}
.go{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-text);font-size:1.3rem;font-weight:700;padding:20px;cursor:pointer;font-family:inherit}
.go:disabled{opacity:.4}
.go.stop{background:#c0392b;color:#fff;margin-top:12px}
.err{color:#c0392b;font-size:.9rem;min-height:1.2em;margin:8px 0 0}
#run{display:none;text-align:center}
.count{color:var(--muted);font-size:1.1rem}
.cmd{font-size:2.4rem;font-weight:800;line-height:1.15;margin:36px 0;min-height:130px;display:flex;align-items:center;justify-content:center}
.bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.hint{font-size:.85rem;color:var(--muted);text-align:center;margin-top:20px}
.num small{font-size:1rem;color:var(--muted);font-weight:500}
.num.bpm{min-width:130px}
input[type=range]{accent-color:var(--accent)}
#mrun{display:none;margin-top:8px}
.step.sm{width:48px;height:48px;font-size:1.5rem}
</style>
</head>
<body>
<main>
<section id="setup">
  <h1>Mes exercices de kiné</h1>
  <p class="sub">Choisissez vos réglages, puis une voix vous donnera les consignes au hasard.</p>

  <div class="card">
    <h2>Parties du corps</h2>
    <div class="grid" id="parts">
      <button class="opt wide" data-p="la tête" aria-pressed="false">Tête</button>
      <button class="opt" data-p="bras droit" aria-pressed="false">Bras droit</button>
      <button class="opt" data-p="bras gauche" aria-pressed="false">Bras gauche</button>
      <button class="opt" data-p="jambe droite" aria-pressed="false">Jambe droite</button>
      <button class="opt" data-p="jambe gauche" aria-pressed="false">Jambe gauche</button>
    </div>
  </div>

  <div class="card">
    <h2>Parties par consigne</h2>
    <div class="grid" id="size">
      <button class="opt" data-n="1" aria-pressed="false">1 seule</button>
      <button class="opt" data-n="2" aria-pressed="true">2 combinées</button>
    </div>
  </div>

  <div class="card">
    <h2>Nombre de répétitions</h2>
    <div class="row">
      <button class="step" id="minus" aria-label="Moins">−</button>
      <div class="num" id="reps">10</div>
      <button class="step" id="plus" aria-label="Plus">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Difficulté (vitesse)</h2>
    <div class="grid" id="level" style="grid-template-columns:1fr 1fr 1fr">
      <button class="opt" data-d="3.5" aria-pressed="true">Facile<br><small>lent</small></button>
      <button class="opt" data-d="2" aria-pressed="false">Moyen</button>
      <button class="opt" data-d="1" aria-pressed="false">Difficile<br><small>rapide</small></button>
    </div>
  </div>

  <div class="card">
    <h2>Métronome</h2>
    <button class="opt" id="metroTog" aria-pressed="false" style="width:100%">Désactivé</button>
    <div id="mset" style="display:none;margin-top:14px">
      <div class="row"><button class="step" id="bmMinus" aria-label="Plus lent">−</button><div class="num bpm"><span id="bpm">60</span> <small>bpm</small></div><button class="step" id="bmPlus" aria-label="Plus rapide">+</button></div>
      <input type="range" id="bpmr" min="30" max="200" value="60" style="width:100%;margin-top:14px" aria-label="Vitesse du métronome">
      <button class="opt" id="prev" style="width:100%;margin-top:12px">Écouter</button>
    </div>
  </div>

  <button class="go" id="start" disabled>Commencer</button>
  <p class="err" id="err"></p>
</section>

<section id="run">
  <p class="count" id="count"></p>
  <div class="bar"><i id="prog"></i></div>
  <div class="cmd" id="cmd"></div>
  <div id="mrun">
    <div class="row"><button class="step sm" id="rMinus" aria-label="Plus lent">−</button><div class="count"><span id="bpm2">60</span> bpm</div><button class="step sm" id="rPlus" aria-label="Plus rapide">+</button></div>
  </div>
  <button class="go stop" id="stop">Arrêter</button>
  <p class="hint">Gardez l’écran allumé et le son activé.</p>
</section>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var reps = 10, delay = 3.5, size = 2, running = false, timer = null, wake = null, voice = null;
  var synth = window.speechSynthesis;

  function refresh(){
    var n = document.querySelectorAll('#parts [aria-pressed="true"]').length;
    $('start').disabled = n === 0;
  }
  function single(group, cb){
    var btns = document.querySelectorAll('#'+group+' .opt');
    btns.forEach(function(b){
      b.addEventListener('click', function(){
        btns.forEach(function(x){x.setAttribute('aria-pressed','false')});
        b.setAttribute('aria-pressed','true');
        cb(b);
      });
    });
  }
  document.querySelectorAll('#parts .opt').forEach(function(b){
    b.addEventListener('click', function(){
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      refresh();
    });
  });
  single('size', function(b){size = +b.dataset.n});
  single('level', function(b){delay = +b.dataset.d});
  $('minus').onclick = function(){reps = Math.max(1, reps - 1); $('reps').textContent = reps};
  $('plus').onclick = function(){reps = Math.min(100, reps + 1); $('reps').textContent = reps};

  var metroOn = false, bpm = 60, ctx = null, mTimer = null, nextT = 0, previewing = false;
  function setBpm(v){
    bpm = Math.max(30, Math.min(200, Math.round(v)));
    $('bpm').textContent = bpm; $('bpm2').textContent = bpm; $('bpmr').value = bpm;
  }
  function tick(t){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1000; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.start(t); o.stop(t + 0.06);
  }
  function runMetro(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!ctx) ctx = new AC();
      if(ctx.state === 'suspended') ctx.resume();
      clearInterval(mTimer);
      nextT = ctx.currentTime + 0.1;
      mTimer = setInterval(function(){
        while(nextT < ctx.currentTime + 0.2){ tick(nextT); nextT += 60 / bpm; }
      }, 50);
    }catch(e){}
  }
  function stopMetro(){ clearInterval(mTimer); mTimer = null; }
  function stopPreview(){ previewing = false; stopMetro(); $('prev').textContent = 'Écouter'; }

  $('metroTog').onclick = function(){
    metroOn = !metroOn;
    this.setAttribute('aria-pressed', metroOn ? 'true' : 'false');
    this.textContent = metroOn ? 'Activé' : 'Désactivé';
    $('mset').style.display = metroOn ? 'block' : 'none';
    if(!metroOn) stopPreview();
  };
  $('bmMinus').onclick = $('rMinus').onclick = function(){ setBpm(bpm - 5); };
  $('bmPlus').onclick = $('rPlus').onclick = function(){ setBpm(bpm + 5); };
  $('bpmr').oninput = function(){ setBpm(+this.value); };
  $('prev').onclick = function(){
    if(previewing){ stopPreview(); }
    else { previewing = true; $('prev').textContent = 'Arrêter l’écoute'; runMetro(); }
  };

  function pickVoice(){
    if(!synth) return;
    var v = synth.getVoices().filter(function(x){return /^fr/i.test(x.lang)});
    voice = v.find(function(x){return /fr[-_]FR/i.test(x.lang)}) || v[0] || null;
  }
  if(synth){pickVoice(); synth.onvoiceschanged = pickVoice;}

  function say(text, done){
    if(!synth){done(); return;}
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if(voice) u.voice = voice;
    u.rate = delay <= 1.5 ? 1.25 : (delay <= 3.5 ? 1.1 : 1);
    var finished = false;
    function end(){ if(!finished){finished = true; done();} }
    u.onend = end; u.onerror = end;
    synth.speak(u);
    setTimeout(end, 8000);
  }

  function pickCombo(parts, last){
    var k = Math.min(size, parts.length), combo, txt, tries = 0;
    do {
      var pool = parts.slice(), c = [];
      while(c.length < k){c.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0])}
      combo = c; txt = c.join(', ');
      tries++;
    } while(txt === last && parts.length > 1 && tries < 20);
    return txt;
  }

  async function lock(){
    try{ if(navigator.wakeLock){wake = await navigator.wakeLock.request('screen');} }catch(e){}
  }
  function unlock(){ try{ if(wake){wake.release(); wake = null;} }catch(e){} }

  function finish(msg){
    running = false;
    clearTimeout(timer);
    if(synth) synth.cancel();
    unlock();
    stopMetro();
    $('cmd').textContent = msg;
  }

  function begin(){
    var parts = Array.prototype.map.call(document.querySelectorAll('#parts [aria-pressed="true"]'), function(b){return b.dataset.p});
    if(!parts.length) return;
    if(!synth){$('err').textContent = 'La synthèse vocale n’est pas disponible sur ce navigateur.'; return;}
    $('err').textContent = '';
    $('setup').style.display = 'none';
    $('run').style.display = 'block';
    $('stop').textContent = 'Arrêter';
    running = true; lock();
    stopPreview();
    $('mrun').style.display = metroOn ? 'block' : 'none';
    if(metroOn) runMetro();
    var i = 0, last = '';
    $('cmd').textContent = 'Préparez-vous…';
    $('count').textContent = '';
    $('prog').style.width = '0';
    say('Préparez-vous', function(){
      timer = setTimeout(next, 2500);
    });
    function next(){
      if(!running) return;
      if(i >= reps){
        finish('Bravo, exercice terminé !');
        $('count').textContent = reps + ' / ' + reps;
        $('prog').style.width = '100%';
        $('stop').textContent = 'Retour';
        say('Bravo, exercice terminé', function(){});
        return;
      }
      i++;
      var txt = pickCombo(parts, last);
      last = txt;
      $('count').textContent = 'Répétition ' + i + ' sur ' + reps;
      $('prog').style.width = ((i-1)/reps*100) + '%';
      $('cmd').textContent = txt;
      say(txt, function(){
        if(!running) return;
        timer = setTimeout(next, delay * 1000);
      });
    }
  }

  $('start').onclick = begin;
  $('stop').onclick = function(){
    finish('');
    $('run').style.display = 'none';
    $('setup').style.display = 'block';
  };
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && running) lock();
  });
})();
</script>
</body>
</html>
